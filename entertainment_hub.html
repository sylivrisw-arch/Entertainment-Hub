/* Preset wallpapers */

<body>
<div class="topbar"><a class="miniapp" href="https://www.youtube.com/" target="_blank" rel="noopener"><i>▶</i> YouTube</a></div>
<section class="hero" id="home"><div class="wall" id="wall"></div><div class="planet"></div><div class="city"></div><div class="wallctl" id="wallctl"><button id="wOpen" aria-haspopup="listbox" aria-expanded="false">🖼 <span id="wName">Default</span> ▾</button><div class="wmenu" id="wMenu" role="listbox"></div></div><div class="hero-copy"><div class="eyebrow">YOUR PERSONAL CINEMA</div><h1>Your<br>Entertainment Hub</h1><p>All your movies, shows, apps and personal content in one place. Watch, explore and make it yours.</p><div class="actions"><button class="primary" id="heroPlay">▶ &nbsp; PLAY</button><button class="secondary" id="heroInfo">ⓘ &nbsp; MORE INFO</button></div></div></section>
<main>
<section class="shelf" id="drives"><div class="shelf-head"><h2>On Your Drives</h2><span class="shelf-sub">▣ &nbsp; LOCAL LIBRARY</span></div><div class="row" id="driveRow"></div></section>
</main>
<div class="toolbar"><button class="smallbtn" id="phoneBtn">📱 Phone</button><button class="smallbtn" id="foldersBtn">📁 Folders</button><button class="smallbtn" id="rescan">↻ Rescan</button></div>

<div class="modal" id="modal"><div class="dialog" id="dialog"><button class="close" id="close">×</button><div id="dialogBody"></div></div></div>
<script>
const $=s=>document.querySelector(s);let movies=[],selectedIndex=0,visibleTiles=[],CAN_ADMIN=false,HAS_FFMPEG=false,LOADED=false;
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':Math.round(b/1048576)+' MB';
const api=async(url,opt)=>{const r=await fetch(url,opt);let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&j.error)||r.statusText||'Request failed');return j};
const jsonOpt=(method,obj)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});

/* ---- tiles ---- */
function card(m){const el=document.createElement('div');el.className='tile';el.tabIndex=0;el.dataset.title=m.title;
el.innerHTML=`<div class="tile-art" style="--c1:#24495a;--c2:#101827"></div><div class="tile-title">${escapeHtml(m.title)}</div><div class="tile-meta">${escapeHtml(m.meta||fmtSize(m.size))}</div>`;
el.addEventListener('click',()=>openMovie(m));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMovie(m)}});return el}

function select(i){if(!visibleTiles.length)return;selectedIndex=(i+visibleTiles.length)%visibleTiles.length;visibleTiles.forEach((x,n)=>x.classList.toggle('selected',n===selectedIndex));visibleTiles[selectedIndex].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
function move(dx,dy){let current=visibleTiles[selectedIndex];if(!current)return;let rows=[...document.querySelectorAll('.row')],row=rows.findIndex(r=>r.contains(current));if(dy===0){let siblings=[...rows[row].querySelectorAll('.tile')],idx=siblings.indexOf(current);select(visibleTiles.indexOf(siblings[(idx+dx+siblings.length)%siblings.length]));return}let targetRow=Math.max(0,Math.min(rows.length-1,row+dy));let target=[...rows[targetRow].querySelectorAll('.tile')];if(!target.length)return;let a=current.getBoundingClientRect(),center=a.left+a.width/2;let best=target.reduce((p,x)=>Math.abs((x.getBoundingClientRect().left+x.offsetWidth/2)-center)<Math.abs((p.getBoundingClientRect().left+p.offsetWidth/2)-center)?x:p,target[0]);select(visibleTiles.indexOf(best))}

const artQ=[];let artBusy=0;

function pumpArt(){while(artBusy<3&&artQ.length){const m=artQ.shift();artBusy++;const img=new Image();const done=()=>{artBusy--;pumpArt()};img.onload=()=>{m.art=img.src;updateArt(m);done()};img.onerror=done;img.src='/art/'+m.id}}

const VID=/\.(mp4|m4v|mkv|avi|mov|webm|wmv|mpg|mpeg|ts|flv)$/i;
function cleanTitle(n,isFile){if(isFile)n=n.replace(/\.[a-z0-9]{2,4}$/i,'');let t=n.replace(/[._]+/g,' ').replace(/\s+/g,' ').trim(),title=t,year='';
const m=t.match(/[\s(\[]((?:19|20)\d{2})(?=[\s)\]]|$)/);
if(m&&m.index>0){title=t.slice(0,m.index);year=m[1]}else{title=t.split(/\b(?:480p|576p|720p|1080p|2160p|4k|bluray|brrip|bdrip|webrip|web-dl|hdtv|dvdrip|x264|x265|h264)\b/i)[0]}
title=title.replace(/[\s\-–(\[]+$/,'').trim()||t;return year?`${title} (${year})`:title}
function baseName(n){return n.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
const JUNK=new Set(['etrg','rarbg','yify','yts','ytsmx','ytsam','sub','subs','subtitles','video','videos','movie','movies','film','films','stream','bdmv','1080p','720p','2160p','x264','x265']);
const isJunk=n=>{const b=baseName(n);return !b||JUNK.has(b)||/^(cd|disc|disk|part)\d+$/.test(b)};
function buildMovies(entries){const dirs=new Map();
for(const e of entries){const dir=e.path.split('/').slice(0,-1).join('/');if(!dirs.has(dir))dirs.set(dir,[]);dirs.get(dir).push(e)}
const out=[];
for(const [dir,vids] of dirs){const parts=dir?dir.split('/'):[],single=vids.length===1,folder=parts[parts.length-1];
vids.forEach(e=>{let title,meta='';
if(single||isJunk(e.name.replace(/\.[^.]+$/,''))){let i=parts.length-1;while(i>=1&&isJunk(parts[i]))i--;
if(i>=1){title=cleanTitle(parts[i],false);meta=i>=2?cleanTitle(parts[i-1],false):''}else title=cleanTitle(e.name,true)}
else{title=cleanTitle(e.name,true);meta=parts.length>=2?cleanTitle(folder,false):''}
out.push({id:e.id,size:e.size,title,meta,art:null})})}
out.sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:'base'}));movies=out}
async function load(rescan){try{const j=await api('/api/library'+(rescan?'?rescan=1':''));CAN_ADMIN=j.admin;HAS_FFMPEG=j.ffmpeg;LOADED=true;$('#foldersBtn').classList.toggle('hidden',!CAN_ADMIN);buildMovies(j.items);render();if(rescan)toast(`${movies.length} movie${movies.length===1?'':'s'} in library`)}catch(e){LOADED=true;render();toast('Could not reach the hub: '+e.message)}}

const mk=(cls,txt,label,dir)=>{const b=document.createElement('button');b.className='rarr '+cls;b.type='button';b.tabIndex=-1;b.setAttribute('aria-label',label);b.textContent=txt;b.addEventListener('click',()=>r.scrollBy({left:dir*Math.max(200,r.clientWidth*.8),behavior:'smooth'}));b.addEventListener('keydown',e=>e.stopPropagation());return b};
const L=mk('l','‹','Scroll left',-1),R=mk('r','›','Scroll right',1);w.append(L,R);
const upd=()=>{const max=r.scrollWidth-r.clientWidth;L.classList.toggle('off',max<=2||r.scrollLeft<=2);R.classList.toggle('off',max<=2||r.scrollLeft>=max-2)};
r.addEventListener('scroll',upd,{passive:true});window.addEventListener('resize',upd);new MutationObserver(()=>setTimeout(upd,0)).observe(r,{childList:true});if(window.ResizeObserver)new ResizeObserver(upd).observe(r);upd()});


load();requestAnimationFrame(pollPad);
